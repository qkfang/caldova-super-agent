<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Caldova Wealth">
  <defs>
    <linearGradient id="cw-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffb347"/>
      <stop offset="100%" stop-color="#ff7a59"/>
    </linearGradient>
  </defs>
  <!-- Rounded tile matching the HUD brand logo -->
  <rect x="4" y="4" width="56" height="56" rx="13"
        fill="url(#cw-tile)" stroke="#1c2230" stroke-width="2"/>
  <!-- Caldova "C" mark -->
  <path d="M41.9 22.1 A14 14 0 1 0 41.9 41.9"
        fill="none" stroke="#1c2230" stroke-width="8" stroke-linecap="round"/>
  <!-- Small rising dot: wealth that keeps growing -->
  <circle cx="45" cy="32" r="3.2" fill="#1c2230"/>
</svg>
